    <script>
      (() => {
        const slowLoadDelayMs = 8000;
        const english = navigator.language.toLowerCase().startsWith("en");
        const labels = english
          ? {
              loading: "Opening editor…",
              loadingDetail: "Your note is safe. This may take a moment on a slow connection.",
              delayed: "The editor is taking longer than expected to open.",
              failed: "The editor could not start.",
              failedDetail: "Check your connection, then retry or return to the note list.",
              back: "Back",
              retry: "Retry",
            }
          : {
              loading: "正在打开编辑器…",
              loadingDetail: "笔记内容是安全的，网络较慢时可能需要稍等片刻。",
              delayed: "编辑器启动时间较长，请检查网络连接。",
              failed: "编辑器未能启动",
              failedDetail: "请检查网络后重试，或先返回笔记列表。",
              back: "返回",
              retry: "重试",
            };
        let mounted = false;
        let slowLoadTimer = 0;

        const getElement = (id) => document.getElementById(id);
        const setBootstrapCopy = (title, detail, state) => {
          if (mounted) return;
          const bootstrap = getElement("mobile-editor-bootstrap");
          const titleElement = getElement("mobile-editor-bootstrap-title");
          const detailElement = getElement("mobile-editor-bootstrap-detail");
          const retryButton = getElement("mobile-editor-bootstrap-retry");
          if (!bootstrap || !titleElement || !detailElement || !retryButton) return;
          bootstrap.dataset.state = state;
          titleElement.textContent = title;
          detailElement.textContent = detail;
          retryButton.hidden = state === "loading";
        };
        const showFailure = () => setBootstrapCopy(labels.failed, labels.failedDetail, "error");
        const onWindowError = (event) => {
          const target = event.target;
          const failedCriticalResource = target instanceof HTMLScriptElement
            || (target instanceof HTMLLinkElement && (target.rel === "stylesheet" || target.rel === "modulepreload"));
          if (target === window || failedCriticalResource) showFailure();
        };
        const onUnhandledRejection = () => showFailure();
        const returnToPreviousPage = () => {
          if (history.length > 1) {
            history.back();
            return;
          }
          const params = new URLSearchParams(location.hash.slice(1));
          const returnTo = params.get("returnTo");
          location.replace(returnTo && returnTo.startsWith("/") ? returnTo : "/");
        };
        const bindBootstrap = () => {
          setBootstrapCopy(labels.loading, labels.loadingDetail, "loading");
          const backButton = getElement("mobile-editor-bootstrap-back");
          const retryButton = getElement("mobile-editor-bootstrap-retry");
          if (backButton) {
            backButton.textContent = labels.back;
            backButton.addEventListener("click", returnToPreviousPage);
          }
          if (retryButton) {
            retryButton.textContent = labels.retry;
            retryButton.addEventListener("click", () => location.reload());
          }
        };

        window.edgeeverMobileEditorBootstrap = {
          markMounted() {
            mounted = true;
            window.clearTimeout(slowLoadTimer);
            window.removeEventListener("error", onWindowError, true);
            window.removeEventListener("unhandledrejection", onUnhandledRejection);
          },
          showFailure,
        };
        window.addEventListener("error", onWindowError, true);
        window.addEventListener("unhandledrejection", onUnhandledRejection);
        document.addEventListener("DOMContentLoaded", bindBootstrap, { once: true });
        slowLoadTimer = window.setTimeout(() => {
          setBootstrapCopy(labels.delayed, labels.loadingDetail, "delayed");
        }, slowLoadDelayMs);
      })();
    </script>
